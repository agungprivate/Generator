<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator</title>
    
    <!-- FAVICON TAB BROWSER -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- GOOGLE FONTS (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- MODERN CLEAN STYLING -->
    <style>
        :root {
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #10b981;
            --success-hover: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* TABS */
        .mode-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-mode {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
        }

        .btn-mode:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-mode.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* SUB-TABS (CRACK) */
        .sub-mode-selector {
            display: none;
            gap: 6px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 10px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-sub-mode {
            padding: 6px 14px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
        }

        .btn-sub-mode:hover {
            color: var(--text-main);
        }

        .btn-sub-mode.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 13px;
            letter-spacing: -0.01em;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 14px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            border-radius: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        textarea:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea#outputText {
            background: #f1f5f9;
            color: #334155;
        }

        /* ACTIONS */
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button.action-btn {
            padding: 12px 18px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button.action-btn:active {
            transform: scale(0.98);
        }

        .btn-both {
            background: #0f172a;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
            flex: 1.2;
            min-width: 160px;
        }
        .btn-both:hover {
            background: #1e293b;
        }

        .btn-convert {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            flex: 1;
            min-width: 120px;
        }
        .btn-convert:hover {
            background: var(--primary-hover);
        }

        .btn-copy {
            background: var(--success);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            flex: 1;
            min-width: 120px;
        }
        .btn-copy:hover {
            background: var(--success-hover);
        }

        /* TOAST */
        .copied-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 9999;
            animation: fadeIn 0.2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">Report Generator</h1>
        
        <!-- POSISI TAB: LOSSKEY DAN TOP 5 BERSEBELAHAN -->
        <div class="mode-selector">
            <button class="btn-mode active" id="btnMode1" type="button" onclick="setMode('downtime')">Losskey</button>
            <button class="btn-mode" id="btnMode5" type="button" onclick="setMode('top5')">Top 5</button>
            <button class="btn-mode" id="btnMode2" type="button" onclick="setMode('excel')">Wrinkle</button>
            <button class="btn-mode" id="btnMode3" type="button" onclick="setMode('crack')">Crack</button>
            <button class="btn-mode" id="btnMode4" type="button" onclick="setMode('rework')">Rework</button>
        </div>

        <!-- SUB-TAB CRACK -->
        <div class="sub-mode-selector" id="crackSubTabs">
            <button class="btn-sub-mode active" id="btnCrackImage" type="button" onclick="setCrackSubMode('image')">Image</button>
            <button class="btn-sub-mode" id="btnCrackExcel" type="button" onclick="setCrackSubMode('excel')">Excel</button>
        </div>

        <div class="grid">
            <div class="panel">
                <label for="inputText">Input Data</label>
                <textarea id="inputText" placeholder="Tempel teks di sini..."></textarea>
            </div>
            <div class="panel">
                <label for="outputText">Hasil Format</label>
                <textarea id="outputText" readonly placeholder="Hasil konversi akan tampil di sini..."></textarea>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn btn-both" type="button" onclick="processBoth()">⚡ Convert & Copy</button>
            <button class="action-btn btn-convert" type="button" onclick="processConvert()">🔄 Convert</button>
            <button class="action-btn btn-copy" type="button" onclick="copyOutput()">📋 Copy</button>
        </div>
    </div>

    <div class="copied-toast" id="toast">✅ Hasil berhasil disalin ke clipboard!</div>

    <script>
        let currentMode = 'downtime';
        let crackSubMode = 'image';

        function setCrackSubMode(subMode) {
            crackSubMode = subMode;

            const btnImg = document.getElementById('btnCrackImage');
            const btnXls = document.getElementById('btnCrackExcel');

            if (subMode === 'image') {
                btnImg.classList.add('active');
                btnXls.classList.remove('active');
            } else {
                btnXls.classList.add('active');
                btnImg.classList.remove('active');
            }

            const inputEl = document.getElementById('inputText');
            const outputEl = document.getElementById('outputText');
            
            if (inputEl && inputEl.value.trim() !== '') {
                let input = inputEl.value.trim();
                let output = (crackSubMode === 'image') 
                    ? formatVisionNaming(input) 
                    : formatCrackExcel(input);

                if (outputEl) outputEl.value = output;
            } else {
                if (outputEl) outputEl.value = '';
            }
        }

        function setMode(mode, keepInput = false) {
            const prevMode = currentMode;
            currentMode = mode;
            
            const tabButtons = [
                { id: 'btnMode1', key: 'downtime' },
                { id: 'btnMode5', key: 'top5' },
                { id: 'btnMode2', key: 'excel' },
                { id: 'btnMode3', key: 'crack' },
                { id: 'btnMode4', key: 'rework' }
            ];

            tabButtons.forEach(tab => {
                const el = document.getElementById(tab.id);
                if (el) {
                    el.classList.toggle('active', tab.key === mode);
                }
            });

            const subTabs = document.getElementById('crackSubTabs');
            if (subTabs) {
                subTabs.style.display = (mode === 'crack') ? 'flex' : 'none';
            }

            const inputEl = document.getElementById('inputText');
            const outputEl = document.getElementById('outputText');

            // Cek apakah perpindahan hanya antara Losskey ('downtime') dan Top 5 ('top5')
            const isLosskeyTop5Pair = (prevMode === 'downtime' && mode === 'top5') || 
                                      (prevMode === 'top5' && mode === 'downtime');

            if (isLosskeyTop5Pair) {
                if (inputEl && inputEl.value.trim() !== '') {
                    processConvert();
                } else if (outputEl) {
                    outputEl.value = '';
                }
            } else {
                if (!keepInput && inputEl) {
                    inputEl.value = '';
                    inputEl.focus();
                }
                if (outputEl) {
                    outputEl.value = '';
                }
            }
        }

        function cleanText(str) {
            if (!str) return '';
            return str.replace(/^[\s:*–=-]+|[\s:*–=-]+$/g, '').trim();
        }

        function extractBlock(keyword, text) {
            if (!text || !keyword) return '';
            const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp('(?:^|\\n)[\\s*_\\[\\]()#–-]*' + escaped + '[\\s*_\\[\\]()#–-]*[:=–-]\\s*(.*)', 'i');
            const match = text.match(regex);
            if (!match) return '';
            
            let val = match[1] ? cleanText(match[1]) : '';
            if (!val || /^[\s*_\\[\\]()–-]*$/.test(val)) {
                let after = text.substring(match.index + match[0].length).trim();
                let firstLine = after.split('\n')[0];
                return cleanText(firstLine);
            }
            return cleanText(val);
        }

        // FUNGSI SERAGAM FORMAT NAMA PIC (Title Case + '&' di nama terakhir)
        function formatPicNames(rawPic) {
            if (!rawPic) return '';

            function toTitleCase(str) {
                return str
                    .toLowerCase()
                    .split(/\s+/)
                    .map(word => {
                        if (!word) return '';
                        if (/^(pd|qc|qa|tw|ca|el|pkg)$/i.test(word)) {
                            return word.toUpperCase();
                        }
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    })
                    .join(' ');
            }

            let names = rawPic
                .split(/[\/,]|\b(?:dan|and)\b|&/gi)
                .map(n => toTitleCase(cleanText(n)))
                .filter(n => n.length > 0);

            if (names.length === 0) return '';
            if (names.length === 1) return names[0];
            if (names.length === 2) return `${names[0]} & ${names[1]}`;
            
            let last = names.pop();
            return `${names.join(', ')} & ${last}`;
        }

        // 1. FORMAT LOSSKEY
        function formatDowntime(text) {
            let section = extractBlock('Section', text);
            let location = extractBlock('Location', text);
            let problem = extractBlock('Problem', text);
            let cause = extractBlock('Cause', text);
            
            let picRaw = extractBlock('PIC', text);
            let pic = formatPicNames(picRaw);

            let matchPart = text.match(/(?:^|\n)[\s*_-]*Part Replacement[\s*_-]*[:=–-]?\s*(.*?)(?=\s*(?:\n|\bPIC\b|\bResult\b|\bStatus\b|\/\/|$))/i);
            let partReplacement = matchPart ? cleanText(matchPart[1]) : '';

            let rawActions = [];
            let lines = text.split('\n');
            let isAction = false;

            for (let line of lines) {
                let trimmed = line.trim();
                if (/^[\s*_-]*(Countermeasure|Action)[\s*_-]*[:=]?/i.test(trimmed)) {
                    isAction = true;
                    let afterHeader = trimmed.replace(/^[\s*_-]*(Countermeasure|Action)[\s*_-]*[:=]?/i, '').trim();
                    if (afterHeader.length > 0) {
                        let clean = afterHeader.replace(/^(\d+[.)]|[-*•])\s*/, '').replace(/[*_]/g, '').trim();
                        if (clean) rawActions.push(clean);
                    }
                    continue;
                }
                if (isAction) {
                    if (/^[\s*_-]*(Result|Part Replacement|PIC|Qty Defect|Start Time|End Time|Duration|Stop Status|Status|Note|Risk Range)[\s*_-]*[:=]/i.test(trimmed)) {
                        isAction = false;
                        continue;
                    }
                    if (trimmed.length > 0) {
                        let cleanAction = trimmed.replace(/^(\d+[.)]|[-*•])\s*/, '').replace(/[*_]/g, '').trim();
                        if (cleanAction) rawActions.push(cleanAction);
                    }
                }
            }

            let formattedActions = rawActions.map((act, idx) => `${idx + 1}. ${act}`);

            let result = `${section || 'Section'} // ${location || 'Location'} // ${problem || 'Problem'} //\n`;
            if (cause && cause !== '-') {
                result += `${cause} //\n`;
            }
            result += `Action :\n`;
            result += (formattedActions.length > 0 ? formattedActions.join('\n') : '');
            
            if (partReplacement && partReplacement !== '-' && !/^[:\s–-]+$/.test(partReplacement)) {
                result += `\n\nPart Replacement: ${partReplacement}`;
            }
            
            result += `\n//\nPIC : ${pic || '-'}`;
            return result;
        }

        // 2. FORMAT WRINKLE
        function formatExcel(text) {
            let line = extractBlock('Line', text);
            if (!line) {
                let matchLine = text.match(/(?:Line|PKG)?\s*[:=–-]?\s*(PKG\s*[0-9]+-[0-9]+|[0-9]+-[0-9]+)/i);
                if (matchLine) line = matchLine[1].toUpperCase();
            }

            let problem = extractBlock('Problem', text);

            let timeRaw = extractBlock('TIME', text) || extractBlock('Jam', text) || extractBlock('Waktu', text);
            if (!timeRaw) {
                let matchTimes = text.match(/\b\d{1,2}[.:]\d{2}\b/g);
                if (matchTimes) timeRaw = matchTimes.join(' & ');
            }

            let pouchId = extractBlock('Pouch ID', text) || extractBlock('Pouch Lot', text) || extractBlock('Pouch', text) || extractBlock('Lot Pouch', text);
            let countRaw = extractBlock('Count', text);
            
            let picRaw = extractBlock('PIC', text);
            let pic = formatPicNames(picRaw);

            let splitRegex = /[,\/;&]+|\b(?:dan|and)\b/i;
            
            let times = timeRaw
                ? timeRaw.split(splitRegex).map(t => t.trim().replace(/(\d{1,2})\.(\d{2})/, '$1:$2')).filter(t => t.length > 0)
                : [];
            let counts = countRaw
                ? countRaw.split(splitRegex).map(c => c.trim().replace(/\./g, '')).filter(c => c.length > 0)
                : [];

            let maxLen = Math.max(times.length, counts.length, 1);
            let rows = [];

            for (let i = 0; i < maxLen; i++) {
                let t = times[i] !== undefined ? times[i] : (times[0] || '');
                let c = counts[i] !== undefined ? counts[i] : (counts[0] || '');
                rows.push(`${line}\t${problem}\t${t}\t${pouchId}\t${c}\t${pic}`);
            }

            return rows.join('\n');
        }

        // 3.A FORMAT CRACK - IMAGE (NAMING)
        function formatVisionNaming(text) {
            let lineMatch = text.match(/(?:Line|PKG)\s*[:=]?\s*([0-9]+-[0-9]+)/i);
            let line = lineMatch ? lineMatch[1] : '';

            let jamRaw = extractBlock('Jam', text) || extractBlock('Time', text);
            let jam = jamRaw.replace(/[^0-9]/g, '');

            let lotId = extractBlock('Lot ID', text) || extractBlock('LotID', text);
            let pouchLot = extractBlock('Pouch Lot', text) || extractBlock('Pouch ID', text);

            let status = 'OVERKILL';
            let lowerText = text.toLowerCase();
            
            if (lowerText.includes('pinhole') || lowerText.includes('pin hole')) {
                status = 'PINHOLE';
            } else if (lowerText.includes('crack')) {
                status = 'CRACK';
            } else if (lowerText.includes('overkill')) {
                status = 'OVERKILL';
            } else if (lowerText.includes('ng')) {
                status = 'NG';
            }

            return `${line}_${jam}_${lotId}_${pouchLot}_${status}`;
        }

      // 3.B FORMAT CRACK - EXCEL
        function formatCrackExcel(text) {
            let lineMatch = text.match(/(?:Line|PKG)\s*[:=–-]?\s*([0-9]+-[0-9]+)/i);
            let line = lineMatch ? lineMatch[1] : extractBlock('Line', text);

            let rawDate = extractBlock('Date', text) || extractBlock('Tanggal', text);
            if (!rawDate) {
                let matchDate = text.match(/\b\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}\b/);
                if (matchDate) rawDate = matchDate[0];
            }

            let date = '';
            if (rawDate) {
                let parts = rawDate.split(/[\/-]/);
                if (parts.length === 3) {
                    if (parts[0].length === 4) {
                        let y = parts[0];
                        let m = String(parts[1]).padStart(2, '0');
                        let d = String(parts[2]).padStart(2, '0');
                        date = `${y}-${m}-${d}`;
                    } else if (parts[2].length === 4) {
                        let d = String(parts[0]).padStart(2, '0');
                        let m = String(parts[1]).padStart(2, '0');
                        let y = parts[2];
                        date = `${y}-${m}-${d}`;
                    }
                }
            }

            if (!date) {
                let today = new Date();
                let y = today.getFullYear();
                let m = String(today.getMonth() + 1).padStart(2, '0');
                let d = String(today.getDate()).padStart(2, '0');
                date = `${y}-${m}-${d}`;
            }

            let time = extractBlock('Time', text) || extractBlock('Jam', text) || extractBlock('Waktu', text);
            if (time) {
                time = time.replace(/(\d{1,2})\.(\d{2})/, '$1:$2');
            } else {
                let matchTime = text.match(/\b\d{1,2}[.:]\d{2}\b/);
                if (matchTime) time = matchTime[0].replace('.', ':');
            }

            let countRaw = extractBlock('Count Cleaning Forming', text) ||
                           extractBlock('Count Cleaning', text) ||
                           extractBlock('Count', text) || 
                           extractBlock('Counting', text) || 
                           extractBlock('Qty', text) || 
                           extractBlock('Jumlah', text);

            let count = '';
            if (countRaw) {
                count = countRaw.replace(/[^0-9]/g, '');
            } else {
                let matchCount = text.match(/Count[^\n:]*[:=–-]?\s*([0-9.,]+)/i);
                if (matchCount) {
                    count = matchCount[1].replace(/[^0-9]/g, '');
                }
            }

            let lotId = extractBlock('Lot ID', text) || extractBlock('LotID', text) || extractBlock('Lot', text);
            let pouchLot = extractBlock('Pouch Lot', text) || extractBlock('Pouch ID', text) || extractBlock('Lot Pouch', text);

            // Kolom Line polos apa adanya
            return `${line}\t${date}\t${time}\t${count}\t${lotId}\t${pouchLot}`;
        }

   // FUNGSI KLASIFIKASI NG NAME (REWORK)
        function matchKlasifikasiNG(fullText, ngRaw) {
            let cleanFull = (fullText || '').replace(/\u00A0/g, ' ');
            let raw = (ngRaw || '').replace(/\u00A0/g, ' ');
            let cleanedNg = raw.replace(/\((.*?)\)/gi, '').trim();
            let ng_lower = cleanedNg.toLowerCase();
            
            // Deteksi tanda (+) atau (-) dari seluruh isi teks
            let sign = '-';
            if (/\(\s*\+\s*\)|\bplus\b/i.test(cleanFull)) {
                sign = '+';
            } else if (/\(\s*-\s*\)|\bminus\b/i.test(cleanFull)) {
                sign = '-';
            }

            if (ng_lower === 'aw' || /\baw\b/i.test(ng_lower) || ng_lower.includes('weight after') || ng_lower.includes('after e/f') || ng_lower.includes('after ef')) {
                return 'Weight After E/F';
            }
            if (ng_lower.includes('weight before') || ng_lower.includes('before e/f') || ng_lower.includes('before ef')) {
                return 'Weight Before E/F';
            }
            if (ng_lower.includes('ir bcr') || ng_lower.includes('barcode read') || ng_lower.includes('read ng') || ng_lower.includes('bcr ng')) {
                return 'Barcode Read NG';
            }
            if (ng_lower.includes('it validation') || ng_lower.includes('barcode it')) {
                return 'Barcode IT Validation';
            }
            if (ng_lower.includes('verify ng') || ng_lower.includes('barcode verify')) {
                return 'Barcode Verify NG';
            }
            if (ng_lower.includes('ir contact')) {
                return 'IR Contact';
            }
            if (/ (ir\s*lc|lc) /i.test(ng_lower) || ng_lower.includes('lead contact')) {
                return 'Lead Contact';
            }
            if (ng_lower.includes('v sealing') || ng_lower.includes('v-sealing') || ng_lower.includes('vsealing')) {
                return 'V Sealing';
            }

            if (ng_lower.includes('lead pos') || ng_lower.includes('leadpos') || ng_lower.includes('lead position') || ng_lower.includes('lead vision') || ng_lower.includes('vision lead')) {
                return 'Lead Vision';
            }
            if (ng_lower.includes('sealing vision') || ng_lower.includes('sealing ng') || ng_lower.includes('sealing')) {
                return 'Sealing Vision';
            }

            if (ng_lower.includes('wrong tab') || ng_lower.includes('tab direction') || ng_lower.includes('wrong direction')) {
                return 'Wrong Tab Direction';
            }
            if (ng_lower.includes('no lead') || ng_lower.includes('nolead')) {
                return 'No Lead';
            }
            if (ng_lower.includes('short contact') || ng_lower.includes('short check') || ng_lower.includes('short')) {
                return 'Short Contact';
            }

            // Lead Film
            if (/lead\s*fi?lm\d*/i.test(ng_lower) || (ng_lower.includes('lead') && ng_lower.includes('film'))) {
                return `Lead Film (${sign})`;
            }

            // Lead R & Lead L (Aman dari spasi/karakter tersembunyi)
            if (/lead\s*r(?![a-z])/i.test(ng_lower)) {
                return `Lead R (${sign})`;
            }
            if (/lead\s*l(?![a-z])/i.test(ng_lower)) {
                return `Lead L (${sign})`;
            }

            if (ng_lower.includes('tab burr') || ng_lower.includes('burr')) {
                return `Tab Burr (${sign})`;
            }
            if (ng_lower.includes('tab press') || ng_lower.includes('press')) {
                return `Tab Press (${sign})`;
            }
            if (ng_lower.includes('main weld') || ng_lower.includes('mainweld') || ng_lower.includes('main_weld')) {
                return `Main Weld (${sign})`;
            }
            if (ng_lower.includes('sepa') || ng_lower.includes('separator')) {
                return `Sepa (${sign})`;
            }
            if (ng_lower.includes('cpp tape') || ng_lower.includes('tape') || ng_lower.includes('cpp')) {
                return `CPP Tape (${sign})`;
            }
            if (ng_lower.includes('gap')) {
                return `GAP (${sign})`;
            }
            if (ng_lower.includes('dimension') || raw.toLowerCase().includes('overkill')) {
                return `Dimension Overkill (${sign})`;
            }

            return raw;
        }

     // 4. FORMAT REWORK
        function formatRework(text) {
            text = text.replace(/\u00A0/g, ' '); // Bersihkan non-breaking space
            let lineMatch = text.match(/(?:#|Line|PKG)?\s*([0-9]+-[0-9]+)/i);
            let line = lineMatch ? `PKG ${lineMatch[1]}` : '';

            let ngRaw = extractBlock('NG', text);
            if (!ngRaw) {
                let matchNg = text.match(/(?:^|\n)[\s*•_–.-]*NG\s*[:=–-]?\s*(.*)/i);
                if (matchNg) ngRaw = cleanText(matchNg[1]);
            }
            let ngName = matchKlasifikasiNG(text, ngRaw);

            let section = 'TW';
            let lowerText = text.toLowerCase();
            let lowerNg = (ngName || '').toLowerCase();

            if (lowerText.includes('cell assy') || lowerText.includes('ca') || lowerNg.includes('sealing vision') || lowerNg.includes('lead vision')) {
                section = 'CA';
            } else if (/\bEL\b|Filling/i.test(text) || lowerNg.includes('weight') || lowerNg.includes('barcode') || lowerNg.includes('ir contact') || lowerNg.includes('lead contact') || lowerNg.includes('v sealing')) {
                section = 'EL';
            } else {
                section = 'TW';
            }

            let cellIdRaw = extractBlock('Cell ID', text) || extractBlock('CellID', text) || extractBlock('Cell', text);
            if (!cellIdRaw) {
                let matchCell = text.match(/(?:Cell\s*ID|CellID)\s*[:=–-]?\s*([A-Za-z0-9_-]+)/i);
                if (matchCell) cellIdRaw = cleanText(matchCell[1]);
            }

            let statusRaw = extractBlock('Status', text);
            let isFailed = /fail|❌|gagal|\bNG\b/i.test(statusRaw);
            let status = isFailed ? 'F' : 'Y';

            let reason = '';
            let detailReason = '';

            if (isFailed) {
                // 1. Cek dulu apakah ada baris NOTE / Keterangan
                let matchNote = text.match(/(?:^|\n)[\s*•_–.-]*NOTE\s*[:=–-]?\s*(.*?)(?=\s*(?:\n\s*(?:Cc\b|PIC\b|Status\b|Total\b)|$))/is);
                if (matchNote && matchNote[1].trim()) {
                    detailReason = matchNote[1].split('\n')[0].trim();
                } else {
                    // 2. Jika tidak ada NOTE, ambil dari keterangan di samping baris Status
                    let matchDetail = statusRaw.match(/^[^(]*\((.*)\)[^)]*$/);
                    if (matchDetail) {
                        detailReason = matchDetail[1].trim();
                    } else {
                        detailReason = statusRaw.replace(/fail(ed)?|❌|gagal|status|[:=]/gi, '').trim();
                    }
                }
                reason = '';
            }

            let picRaw = extractBlock('PIC', text);
            let pic = formatPicNames(picRaw);

            let lotId = '';

            let cellIds = cellIdRaw
                .split(/[,;\n&]+|\b(?:dan|and)\b/i)
                .map(id => id.trim())
                .filter(id => id.length > 0);
            
            if (cellIds.length === 0) cellIds = [''];

            let results = cellIds.map(cellId => {
                let pkgId = (section === 'EL') ? cellId : '';
                let stkId = (section === 'TW' || section === 'CA') ? cellId : '';
                return `${line}\t${section}\t${ngName}\t${lotId}\t${pkgId}\t${stkId}\t${status}\t${reason}\t${detailReason}\t${pic}`;
            });

            return results.join('\n');
        }

        // 5. FORMAT TOP 5 (Line \t Root Cause \t Adjustment)
        function formatTop5(text) {
            let lineMatch = text.match(/(?:Line\s*ID|Line|PKG)\s*[:=–-]?\s*([0-9]+-[0-9]+)/i);
            let line = lineMatch ? lineMatch[1] : '';

            let rootCause = extractBlock('Cause', text) || extractBlock('Root Cause', text);
            let picRaw = extractBlock('PIC', text);
            let pic = formatPicNames(picRaw);

            let rawActions = [];
            let lines = text.split('\n');
            let isAction = false;

            for (let l of lines) {
                let trimmed = l.trim();
                if (/^[\s*_-]*(Countermeasure|Action|Adjustment)[\s*_-]*[:=]?/i.test(trimmed)) {
                    isAction = true;
                    let afterHeader = trimmed.replace(/^[\s*_-]*(Countermeasure|Action|Adjustment)[\s*_-]*[:=]?/i, '').trim();
                    if (afterHeader.length > 0) {
                        let clean = afterHeader.replace(/^(\d+[.)]|[-*•])\s*/, '').replace(/[*_]/g, '').trim();
                        if (clean) rawActions.push(clean);
                    }
                    continue;
                }
                if (isAction) {
                    if (/^[\s*_-]*(Result|Part Replacement|PIC|Qty Defect|Start Time|End Time|Duration|Stop Status|Status|Note|Risk Range)[\s*_-]*[:=]/i.test(trimmed)) {
                        isAction = false;
                        continue;
                    }
                    if (trimmed.length > 0) {
                        let cleanAction = trimmed.replace(/^(\d+[.)]|[-*•])\s*/, '').replace(/[*_]/g, '').trim();
                        if (cleanAction) rawActions.push(cleanAction);
                    }
                }
            }

            // Langsung daftar item tanpa tulisan "Action :"
            let formattedAdjustment = rawActions.map(act => `- ${act}`).join('\n');
            
            // Jarak 1 enter kosong sebelum PIC
            if (pic) {
                formattedAdjustment += (formattedAdjustment ? '\n\n' : '') + `PIC : ${pic}`;
            }

            let safeAdjustment = `"${formattedAdjustment.replace(/"/g, '""')}"`;

            // Prefix ="line" khusus Top 5 agar tidak menjadi tanggal di Excel
            return `="${line}"\t${rootCause}\t${safeAdjustment}`;
        }

        function showToast() {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.style.display = 'block';
                setTimeout(() => { 
                    toast.style.display = 'none'; 
                }, 2000);
            }
        }

        function processConvert() {
            const inputEl = document.getElementById('inputText');
            const outputEl = document.getElementById('outputText');
            
            let input = inputEl ? inputEl.value.trim() : '';
            if (!input) {
                if (outputEl) outputEl.value = '';
                return;
            }

            let output = '';
            if (currentMode === 'downtime') {
                output = formatDowntime(input);
            } else if (currentMode === 'excel') {
                output = formatExcel(input);
            } else if (currentMode === 'crack') {
                output = (crackSubMode === 'image') ? formatVisionNaming(input) : formatCrackExcel(input);
            } else if (currentMode === 'rework') {
                output = formatRework(input);
            } else if (currentMode === 'top5') {
                output = formatTop5(input);
            }

            if (outputEl) {
                outputEl.value = output;
            }
        }

        function copyOutput() {
            const outputEl = document.getElementById('outputText');
            let textToCopy = outputEl ? outputEl.value.trim() : '';

            if (!textToCopy) return;

            outputEl.select();
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast();
                }).catch(() => {
                    document.execCommand('copy');
                    showToast();
                });
            } else {
                document.execCommand('copy');
                showToast();
            }
        }

        function processBoth() {
            processConvert();
            copyOutput();
        }

        // FITUR AUTO-DETECT MODE SAAT INPUT / PASTE
        function autoDetectMode(text) {
            if (!text || text.trim().length < 4) return;
            
            let clean = text.replace(/\u00A0/g, ' ');
            let lower = clean.toLowerCase();

            // 1. Prioritas Rework
            if (lower.includes('cell id') || lower.includes('cellid') || /(?:^|\n)[^\w\n]*ng\s*[:=–-]/i.test(clean)) {
                if (currentMode !== 'rework') setMode('rework', true);
                return;
            }

            // 2. Prioritas Crack
            if (lower.includes('crack') || lower.includes('pinhole') || (lower.includes('lot id') && lower.includes('pouch lot'))) {
                if (currentMode !== 'crack') setMode('crack', true);
                return;
            }

            // 3. Prioritas Wrinkle
            if ((lower.includes('pouch id') || lower.includes('pouch lot')) && (lower.includes('count') || /\b\d{1,2}[.:]\d{2}\b/.test(clean))) {
                if (currentMode !== 'excel') setMode('excel', true);
                return;
            }

            // 4. Prioritas Losskey / Top 5 (Downtime Bot)
            if (
                lower.includes('downtime bot') || 
                lower.includes('countermeasure') || 
                (lower.includes('start time') && lower.includes('duration')) ||
                (lower.includes('section:') && lower.includes('location:'))
            ) {
                if (currentMode !== 'top5' && currentMode !== 'downtime') {
                    setMode('downtime', true);
                }
                return;
            }
        }

        const inputArea = document.getElementById('inputText');
        if (inputArea) {
            inputArea.addEventListener('input', function(e) {
                autoDetectMode(e.target.value);
            });
            inputArea.addEventListener('paste', function(e) {
                let pastedData = (e.clipboardData || window.clipboardData).getData('text');
                autoDetectMode(pastedData);
            });
        }
    </script>
